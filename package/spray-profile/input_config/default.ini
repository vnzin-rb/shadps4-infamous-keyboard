# Isolated two-finger profile for CUSA00004.
# Delete = finger 1, Page Down = finger 2; hold both for two contacts.
#Feeling lost? Check out the Help section!

# Keyboard bindings

triangle = kp8
circle = kp6
cross = kp2
square = kp4
# Alternatives for users without a keypad
triangle = c
circle = b
cross = n
square = v

l1 = q
r1 = u
l2 = e
r2 = o
l3 = x
r3 = m

options = enter
touchpad_center = space
touchpad_left = delete
touchpad_right = pgdown

pad_up = up
pad_down = down
pad_left = left
pad_right = right

axis_left_x_minus = a
axis_left_x_plus = d
axis_left_y_minus = w
axis_left_y_plus = s

axis_right_x_minus = j
axis_right_x_plus = l
axis_right_y_minus = i
axis_right_y_plus = k

# Controller bindings

triangle = triangle
cross = cross
square = square
circle = circle

l1 = l1
l2 = l2
l3 = l3
r1 = r1
r2 = r2
r3 = r3

options = options
touchpad_center = back

pad_up = pad_up
pad_down = pad_down
pad_left = pad_left
pad_right = pad_right

axis_left_x = axis_left_x
axis_left_y = axis_left_y
axis_right_x = axis_right_x
axis_right_y = axis_right_y

# Range of deadzones: 1 (almost none) to 127 (max)
analog_deadzone = leftjoystick, 5, 127
analog_deadzone = rightjoystick, 5, 127

override_controller_color = false, 0, 0, 255

# Hold G to turn sideways; hold H to shake. F6 mouse gyro; O sprays.
motion_sideways = g
motion_shake = h

# Hold P for a downward touchpad swipe (300 ms); release to lift the finger.
touchpad_swipe_down = p

# Number row (not numpad): up, down, left, right. P remains a down alias.
touchpad_swipe_up = 1
touchpad_swipe_down = 2
touchpad_swipe_left = 3
touchpad_swipe_right = 4
